services:
  orchestrator:
    build: .
    image: gameqa-orchestrator
    container_name: gameqa-orchestrator
    ports:
      - "9111:9111"
    volumes:
      - gameqa-data:/app/data          # 任务数据与 TLS 证书持久化
    environment:
      # 公网/不可信网络部署时务必设置（Agent 需同名变量）
      - PLATFORM_TOKEN=${PLATFORM_TOKEN:-}
      # 正式证书（可选）：挂载后指向容器内路径
      # - TLS_CERT=/app/certs/cert.pem
      # - TLS_KEY=/app/certs/key.pem
      # - TLS_MODE=auto
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--no-check-certificate", "-O", "/dev/null", "https://localhost:9111/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s

volumes:
  gameqa-data:
