name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gates:
    name: 门槛（tsc + vitest + build）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装 ripgrep（Grep 工具主路径）
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep

      - name: 安装依赖
        run: npm ci

      - name: 类型检查 (tsc --noEmit)
        run: npx tsc --noEmit

      - name: 单元测试 (vitest)
        run: npx vitest run

      - name: 构建产物 (含入口 shebang/chmod)
        run: npm run build
